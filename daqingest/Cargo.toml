[package]
name = "daqingest"
version = "0.2.2"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
edition = "2021"

[features]
default = []
# default = ["bsread"]
bsread = []

[dependencies]
clap = { version = "4.5.1", features = ["derive", "cargo"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
tokio-postgres = "0.7.10"
async-channel = "2.3.1"
futures-util = "0.3"
chrono = "0.4"
bytes = "1.6.0"
libc = "0.2"
err = { path = "../../daqbuffer/crates/err" }
netpod = { path = "../../daqbuffer/crates/netpod" }
taskrun = { path = "../../daqbuffer/crates/taskrun" }
log = { path = "../log" }
stats = { path = "../stats" }
scywr = { path = "../scywr" }
dbpg = { path = "../dbpg" }
series = { path = "../series" }
netfetch = { path = "../netfetch" }
serieswriter = { path = "../serieswriter" }
#ingest-bsread = { path = "../ingest-bsread" }
ingest-linux = { path = "../ingest-linux" }
