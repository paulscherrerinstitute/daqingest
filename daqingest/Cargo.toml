[package]
name = "daqingest"
version = "0.2.7-aa.0"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
edition = "2021"

[features]
default = []
# default = ["bsread"]
bsread = []

[dependencies]
clap = { version = "4.5.20", features = ["derive", "cargo"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
tokio-postgres = "0.7.12"
async-channel = "2.3.1"
futures-util = "0.3"
chrono = "0.4.38"
bytes = "1.8.0"
libc = "0.2"
autoerr = "0.0.3"
err = { path = "../../daqbuf-err", package = "daqbuf-err" }
netpod = { path = "../../daqbuf-netpod", package = "daqbuf-netpod" }
taskrun = { path = "../../daqbuffer/crates/taskrun" }
series = { path = "../../daqbuf-series", package = "daqbuf-series" }
channeltools = { path = "../../daqbuf-channeltools", package = "daqbuf-channeltools" }
log = { path = "../log" }
stats = { path = "../stats" }
scywr = { path = "../scywr" }
dbpg = { path = "../dbpg" }
netfetch = { path = "../netfetch" }
serieswriter = { path = "../serieswriter" }
#ingest-bsread = { path = "../ingest-bsread" }
ingest-linux = { path = "../ingest-linux" }
